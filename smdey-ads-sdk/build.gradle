plugins {
    id 'com.android.library'
    id 'maven-publish'
}

android {
    namespace 'com.smdey.ads.sdk'
    compileSdk 37

    defaultConfig {
        minSdk 28
        targetSdk 37
        consumerProguardFiles 'consumer-rules.pro'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    publishing {
        singleVariant('release') {
            withSourcesJar()
        }
    }
}

dependencies {
    implementation 'androidx.annotation:annotation:1.10.0'
    implementation 'androidx.lifecycle:lifecycle-common:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-process:2.11.0'

    // GMA Next-Gen SDK & UMP
    api 'com.google.android.libraries.ads.mobile.sdk:ads-mobile-sdk:1.4.0'
    api 'com.google.android.ump:user-messaging-platform:4.0.0'

    // Facebook Shimmer
    api 'com.facebook.shimmer:shimmer:0.5.0'
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                groupId = 'com.github.3bdesamad'
                artifactId = 'smdey-ads-sdk'
                version = '1.0.0'
            }
        }
    }
}
