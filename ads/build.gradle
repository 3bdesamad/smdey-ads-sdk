plugins {
    id 'com.android.library'
    id 'maven-publish'
}

android {
    namespace 'com.smdey.ads'
    compileSdk 37

    defaultConfig {
        minSdk 28
        targetSdk 37

        consumerProguardFiles 'proguard-rules.pro'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    tasks.withType(JavaCompile).configureEach {
        options.compilerArgs << "-Xlint:deprecation"
    }

    publishing {
        singleVariant('release') {
            withSourcesJar()
        }
    }
}

dependencies {
    // Compile-only: allows host app to supply lifecycle without SDK locking version
    compileOnly 'androidx.lifecycle:lifecycle-common:2.11.0'

    // Google Mobile Ads (GMA Next-Gen) & UMP SDK
    api 'com.google.android.libraries.ads.mobile.sdk:ads-mobile-sdk:1.4.0'
    api 'com.google.android.ump:user-messaging-platform:4.0.0'

    // Facebook Shimmer (for Banner Skeleton)
    implementation 'com.facebook.shimmer:shimmer:0.5.0'
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                groupId = 'com.github.3bdesamad'
                artifactId = 'smdey-ads-sdk'
                version = '1.0.0'
            }
        }
    }
}
